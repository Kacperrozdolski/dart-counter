<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<!-- "Add to Home Screen": opens full screen, without the browser's bars (more room for the board). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Dart Counter</title>
<style>
  :root {
    --bg: #111418;
    --panel: #1b2027;
    --panel-2: #242b34;
    --text: #eef1f4;
    --muted: #8b95a3;
    --accent: #f5c542;
    --danger: #e5484d;
    --ok: #30a46c;
    --board-dark: #1a1a1a;
    --board-light: #efdcb5;
    --board-red: #d0352d;
    --board-green: #1f8a4c;
    --wire: #a9a9a9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    /* Even 16px on every side; grows only where the notch / home bar needs more. */
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    min-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- Setup ---------- */
  h1 { margin: 8px 0 0; font-size: 28px; letter-spacing: -0.02em; }
  .card { background: var(--panel); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
  .player-row { display: flex; gap: 8px; }
  .player-row input {
    flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--panel-2);
    background: var(--bg); color: var(--text); font: inherit; user-select: text;
  }
  .icon-btn { width: 46px; border: 0; border-radius: 10px; background: var(--panel-2); font-size: 20px; }
  .ghost { border: 1px dashed var(--panel-2); background: none; border-radius: 10px; padding: 10px; color: var(--muted); }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; border: 0; background: none; padding: 10px; border-radius: 8px; color: var(--muted); font-weight: 600; }
  .seg button.on { background: var(--panel-2); color: var(--text); }
  .toggle { display: flex; align-items: center; justify-content: space-between; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
  .primary {
    border: 0; border-radius: 12px; padding: 16px; background: var(--accent); color: #1a1a1a;
    font-weight: 700; font-size: 18px;
  }

  /* Start button stays pinned to the bottom of the screen: pushed down when the
     setup is short, and kept in view (over the scrolling cards) when it's long. */
  /* A full-width bottom bar that fades in from transparent: no hard edge or
     dark band around the button. */
  .start-bar {
    position: sticky; bottom: 0; z-index: 1; margin: auto -16px 0;
    padding: 20px 16px max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, rgba(17, 20, 24, 0), var(--bg) 20px);
    display: flex; flex-direction: column;
  }
  #setup { padding-bottom: 0; }   /* the bar brings its own bottom spacing */

  /* ---------- Game ---------- */
  .link { border: 0; background: none; color: var(--muted); padding: 6px 0; }
  .player { cursor: pointer; }
  .edit-row { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .edit-row input {
    padding: 12px; border-radius: 10px; border: 1px solid var(--panel-2); background: var(--bg);
    color: var(--text); font: inherit; font-size: 20px; user-select: text;
  }
  .edit-row input.bad { border-color: var(--danger); }
  /* Horizontal carousel: cards share the width when they fit, otherwise scroll sideways. */
  .players {
    display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 8px;
    scrollbar-width: none; flex-shrink: 0;
  }
  .players::-webkit-scrollbar { display: none; }
  .players .player { flex: 1 0 140px; min-width: 0; scroll-snap-align: center; }
  .player {
    background: var(--panel); border-radius: 12px; padding: 8px 12px 10px; border: 2px solid transparent;
    display: flex; flex-direction: column; gap: 2px;
  }
  .player.active { border-color: var(--accent); }
  .player .name { font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; overflow: hidden; }
  .player .legs { color: var(--accent); font-weight: 700; }
  /* Scores are always laid out at full size; inactive ones are scaled down, so
     switching players can animate smoothly without reflowing the cards. */
  .player .score {
    font-size: 44px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums;
    color: var(--muted); transform: scale(.73); transform-origin: left center;
  }
  .player.active .score { transform: none; color: var(--text); }
  @media (prefers-reduced-motion: no-preference) {
    .player { transition: border-color .25s ease; }
    .player .score { transition: transform .25s ease, color .25s ease; }
  }
  .player .avg { font-size: 12px; color: var(--muted); }

  .turn { display: flex; gap: 8px; align-items: stretch; }
  .slot {
    flex: 1; background: var(--panel); border-radius: 10px; padding: 4px 0; text-align: center;
    font-weight: 700; font-size: 20px; min-height: 48px; display: flex; align-items: center; justify-content: center;
  }
  .slot.empty { color: var(--panel-2); }
  .slot.t { color: var(--board-red); }
  .slot.d { color: #3ecf7f; }
  .slot.total { flex: 1.2; background: var(--panel-2); font-size: 24px; font-variant-numeric: tabular-nums; }
  .player .last { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .last.bust { color: var(--danger); }

  #game.wrap { max-width: 900px; height: 100dvh; min-height: 0; gap: 10px; }
  /* The board takes whatever height is left and shrinks to fit: the game screen
     never scrolls, so the buttons below always stay on screen. */
  .board-wrap { position: relative; flex: 1; min-height: 0; margin: 0 -12px; }
  .exit-btn {
    align-self: flex-start; flex-shrink: 0; width: 30px; height: 30px; margin-bottom: 14px; border: 0; border-radius: 50%;
    background: var(--panel); color: var(--muted); font-size: 14px; line-height: 1;
  }
  svg.board { touch-action: none; }
  svg.board { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  #game .players, #game .turn, #game .actions { width: 100%; max-width: 520px; margin: 0 auto; }
  svg.board { cursor: pointer; }
  .board-art .hl { fill: #fff; fill-opacity: .28; stroke: var(--accent); stroke-width: 2.5; pointer-events: none; transition: fill-opacity .12s; }
  .board-art .hl.flash { fill-opacity: .7; transition: none; }
  .board-art .wire { stroke: var(--wire); stroke-width: .7; }
  .board-art .num.co { fill: var(--accent); }
  @media (prefers-reduced-motion: no-preference) { .board-art .num { transition: fill .25s ease; } }
  .board-art .num { fill: #fff; font-weight: 700; font-size: 17px; pointer-events: none; text-anchor: middle; dominant-baseline: central; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { border: 0; border-radius: 12px; padding: 12px; background: var(--panel-2); font-weight: 700; font-size: 16px; }
  #game .actions button { padding: 0 8px; height: 56px; font-size: 15px; white-space: nowrap; }
  #game .actions .miss { font-size: 18px; }
  /* Floating "Next player" action: bottom-right of the board area, under the right
     thumb. It may overlap the board's corner, which is locked while it shows. */
  .fab {
    position: absolute; right: 12px; bottom: 4px; z-index: 2; max-width: calc(100% - 24px);
    height: 60px; padding: 0 24px; border: 0; border-radius: 30px;
    background: var(--accent); color: #1a1a1a; font-weight: 800; font-size: 18px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 10px 28px rgba(0,0,0,.55), 0 0 0 4px rgba(245,197,66,.18);
  }
  /* Pops in, then a slow, soft glow so it reads as "your move" without nagging. */
  .fab:not([hidden]) { animation: fab-in .22s cubic-bezier(.2, .9, .3, 1.3), fab-glow 2.4s ease-in-out .3s infinite; }
  @keyframes fab-in { from { opacity: 0; transform: translateY(10px) scale(.92); } }
  @keyframes fab-glow {
    50% { box-shadow: 0 10px 28px rgba(0,0,0,.55), 0 0 0 9px rgba(245,197,66,.10); }
  }
  @media (prefers-reduced-motion: reduce) { .fab:not([hidden]) { animation: none; } }  .slot.total.bust { background: var(--danger); color: #fff; font-size: 18px; }
  /* Turn finished: board and dart inputs rest until "Next" is pressed (Undo stays live). */
  #game.pending #missBtn, #game.pending #typeBtn { opacity: .3; }
  .board-wrap.locked svg.board { cursor: default; }
  .board-wrap.locked svg.board > :not(.markers) { opacity: .35; }   /* markers stay readable */

  /* Hit markers: where each dart of this turn was tapped. */
  .markers { pointer-events: none; }
  .markers circle { fill: #fff; stroke: #111; stroke-width: 2; }
  .markers text { font-size: 10px; font-weight: 800; fill: #111; text-anchor: middle; dominant-baseline: central; }

  /* Feedback animations: short, never block input, off with "Reduce motion". */
  @media (prefers-reduced-motion: no-preference) {
    .markers .mk-new { animation: mk-in .18s cubic-bezier(.2, .9, .3, 1.4); transform-box: fill-box; transform-origin: center; }
    .slot.pop { animation: slot-pop .22s ease-out; }
    .slot.total.shake { animation: shake .3s ease-in-out; }
    button { transition: transform .08s; }
    button:active:not(:disabled) { transform: scale(.96); }
  }
  @keyframes mk-in { from { transform: scale(0); opacity: 0; } }
  @keyframes slot-pop { from { transform: scale(1.15); filter: brightness(1.8); } }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .actions .miss {
    background: var(--panel-2); color: #ff8589;
    font-size: 18px; letter-spacing: .04em;
  }
  #game .actions { grid-template-columns: 1fr 1.4fr 1fr; }

  .loupe {
    position: fixed; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; z-index: 15;
    border: 3px solid var(--accent); box-shadow: 0 8px 30px rgba(0,0,0,.6); pointer-events: none; background: #0b0b0b;
  }
  .loupe svg { width: 100%; height: 100%; display: block; }
  .loupe svg .hl { stroke-width: 2; vector-effect: non-scaling-stroke; }
  .loupe::after {
    content: ''; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #000;
  }
  .loupe-label {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(0,0,0,.75);
    padding: 1px 8px; border-radius: 999px; font-weight: 800; font-size: 15px; z-index: 1;
  }

  .pad-input {
    width: 100%; padding: 10px; border-radius: 12px; border: 2px solid var(--panel-2); background: var(--bg);
    color: var(--text); font: inherit; font-size: 44px; font-weight: 800; text-align: center; user-select: text;
  }
  .pad-input:focus { outline: none; border-color: var(--accent); }
  .pad-hint { color: var(--muted); font-size: 14px; }
  .pad-hint:empty { display: none; }
  .pad-hint.bad { color: var(--danger); }
  .pad-ok:disabled { opacity: .35; }


  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center;
    z-index: 20;
    /* Clear of the notch / status bar too (the home-screen app draws under it). */
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .overlay .card { width: 100%; max-width: 380px; text-align: center; }
  .overlay h2 { margin: 4px 0; font-size: 28px; }
  .overlay .stats { color: var(--muted); }

  .overlay .actions.three { grid-template-columns: repeat(3, 1fr); }
  .standings { margin-top: 4px; color: var(--text); }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
    width: 100%; max-width: 520px; margin: 0 auto 14px;
  }
  .topbar .exit-btn { margin: 0; }
  .match-info { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match-info.co { color: var(--accent); font-weight: 700; font-size: 16px; letter-spacing: .02em; }
  .top-btn {
    height: 30px; padding: 0 14px; border: 0; border-radius: 15px; background: var(--panel);
    color: var(--muted); font-size: 13px; font-weight: 600; flex-shrink: 0;
  }

  /* ---------- History / heatmap sheet ---------- */
  /* Fixed height, so switching tabs/legs/players never resizes or re-centres the
     sheet; content scrolls inside it instead. */
  /* Header and footer stay put; only the body in between scrolls. */
  #statsOverlay .card {
    max-width: 520px; height: min(100%, 820px); padding: 0; gap: 0; overflow: hidden; text-align: left;
  }
  .sheet-top, .sheet-foot { flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  .sheet-top { border-bottom: 1px solid var(--panel-2); }
  .sheet-foot { border-top: 1px solid var(--panel-2); }
  .sheet-body {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 16px;
  }
  .sheet-body > * { flex-shrink: 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -4px 0 0; }
  .sheet-head h3 { margin: 0; font-size: 18px; }
  .sheet-x {
    width: 36px; height: 36px; flex-shrink: 0; border: 0; border-radius: 50%;
    background: var(--panel-2); color: var(--text); font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  /* In-app confirm (replaces the browser's native confirm box). */
  #confirmOverlay { z-index: 30; }
  #confirmOverlay .card { max-width: 340px; }
  .confirm-title { margin: 4px 0 0; font-size: 22px; }
  .actions .danger { background: var(--danger); color: #fff; }
  .sheet-close { height: 52px; border: 0; border-radius: 12px; background: var(--panel-2); font-weight: 700; font-size: 16px; }
  .seg.scroll { overflow-x: auto; scrollbar-width: none; }
  .seg.scroll::-webkit-scrollbar { display: none; }
  .seg.scroll button { flex: 1 0 auto; padding: 8px 12px; white-space: nowrap; }
  .stats-empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  .sum th { color: var(--muted); font-weight: 600; font-size: 12px; text-align: right; padding: 0 0 4px 8px; }
  .sum td { text-align: right; padding: 3px 0 3px 8px; }
  .sum th:first-child, .sum td:first-child { text-align: left; padding-left: 0; max-width: 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum tr.won td:first-child { color: var(--accent); font-weight: 700; }   /* leg winner */
  .h-round { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 2px; }
  .h-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto 3.2em 3.2em; gap: 10px; align-items: baseline;
    padding: 6px 0; border-bottom: 1px solid var(--panel-2); font-variant-numeric: tabular-nums;
  }
  .h-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-darts { color: var(--muted); font-size: 14px; }
  .h-total { text-align: right; font-weight: 700; }
  .h-left { text-align: right; color: var(--muted); }
  .h-row.bust .h-total { color: var(--danger); font-size: 13px; }
  .h-row.out .h-total, .h-row.out .h-left { color: #3ecf7f; }
  .h-row.live { border-bottom-style: dashed; }   /* turn still in progress */
  .h-row.live .h-name { color: var(--accent); }
  .heat-board { width: 100%; max-width: 380px; aspect-ratio: 1; display: block; margin: 0 auto; }
  .heat-board > :not(.heat):not(defs) { opacity: .4; }
  .heat .pin { fill: #fff; stroke: #000; stroke-width: .8; }
  /* "Most hit": simple grid of tiles, 4 per row, most hit first. */
  .hits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .hit {
    background: var(--panel-2); border-radius: 10px; padding: 8px 4px; text-align: center;
    display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums;
  }
  .hit-l { font-weight: 800; font-size: 18px; }
  .hit-n { color: var(--muted); font-size: 13px; }
  .hit.miss .hit-l { color: #ff8589; }
  .note { color: var(--muted); font-size: 13px; }

  #padOverlay, #editOverlay { inset: auto 0 auto 0; top: 0; height: 100%; }
  #padOverlay { align-items: flex-end; padding: 0; }
  #padOverlay .card {
    max-width: 520px; border-radius: 18px 18px 0 0;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }

  /* ---------- Responsive overrides (last, so they win over the rules above) ---------- */

  /* Short screens (iPhone SE, any phone with Safari's bars showing): everything
     around the board goes compact so the board gets the height. */
  @media (max-height: 740px) {
    #game.wrap { gap: 8px; padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .topbar { margin-bottom: 2px; }
    .player { padding: 6px 10px 8px; gap: 0; }
    .player .avg { display: none; }   /* in History; the last turn stays */
    .player .score { font-size: 34px; }
    .slot { min-height: 40px; font-size: 18px; }
    .slot.total { font-size: 20px; }
    #game .actions button { height: 48px; }
    .fab { height: 52px; }
    /* Stats sheet: tighter header/footer so the scrolling body keeps its room. */
    .sheet-top, .sheet-foot { padding: 12px; gap: 8px; }
    .sheet-body { padding: 10px 12px 12px; }
    .sheet-x { width: 32px; height: 32px; }
    .sheet-close { height: 44px; }
    .sheet-top .seg button { padding: 7px 10px; }
  }

  /* Phones on their side: board on the left at full height, everything else in a
     column on the right (stacked, the board would be a few dozen pixels tall). */
  @media (orientation: landscape) and (max-height: 540px) {
    #game.wrap {
      display: grid; max-width: none; gap: 8px 16px;
      grid-template-columns: minmax(0, 1fr) clamp(260px, 42vw, 380px);
      grid-template-rows: auto auto auto 1fr auto;
      grid-template-areas: "board top" "board players" "board turn" "board ." "board actions";
      padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .topbar { grid-area: top; margin: 0; }
    #game .players { grid-area: players; }
    #game .turn { grid-area: turn; }
    #game .actions { grid-area: actions; grid-template-columns: repeat(3, 1fr); }
    #game .actions button { font-size: 14px; padding: 0 4px; }
    #game .actions .miss { font-size: 16px; }
    .players .player { flex-basis: 110px; }
    .board-wrap { grid-area: board; margin: 0; }
    /* Very little height: the whole stats sheet scrolls, header and footer included. */
    #statsOverlay .card { overflow-y: auto; }
    .sheet-body { flex: none; min-height: auto; overflow: visible; }
    .overlay { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<!-- Setup screen -->
<div id="setup" class="wrap">
  <h1>Dart Counter</h1>
  <div class="card">
    <div class="label">Players</div>
    <div id="playerInputs" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="ghost" id="addPlayer">+ Add player</button>
  </div>
  <div class="card">
    <div class="label">Starting score</div>
    <div class="seg" id="startSeg">
      <button data-v="301">301</button>
      <button data-v="501">501</button>
      <button data-v="701">701</button>
    </div>
    <label class="toggle"><span>Double out</span><input type="checkbox" id="doubleOut"></label>
  </div>
  <div class="card">
    <div class="label">Legs to win the match</div>
    <div class="seg" id="legsSeg">
      <button data-v="1">1</button>
      <button data-v="2">2</button>
      <button data-v="3">3</button>
      <button data-v="4">4</button>
      <button data-v="5">5</button>
    </div>
  </div>
  <div class="start-bar"><button class="primary" id="startBtn">Start game</button></div>
</div>

<!-- Game screen -->
<div id="game" class="wrap" hidden>
  <div class="topbar">
    <button class="exit-btn" id="quitBtn" aria-label="Leave game">✕</button>
    <span class="match-info" id="matchInfo"></span>
    <button class="top-btn" id="histBtn">History</button>
  </div>
  <div class="players" id="players"></div>
  <div class="turn" id="turn"></div>
  <div class="board-wrap" id="boardWrap"><button class="fab" id="nextBtn" hidden></button><svg class="board board-art" id="board" viewBox="-213 -213 426 426" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="actions">
    <button id="typeBtn">Type score</button>
    <button class="miss" id="missBtn">MISS</button>

<script>
// ---------- Board geometry ----------
// Ring radii in SVG units, based on a regulation board (bull 6.35mm, outer bull
// 15.9mm, triple 99–107mm, double 162–170mm) scaled so the double ends at 184.
// Triple, double and bull are only slightly widened so they stay tappable.
const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const R = { bull: 8, outerBull: 19, tripleIn: 105, tripleOut: 117, doubleIn: 172, doubleOut: 184, numbers: 212 };
const SVG_NS = 'http://www.w3.org/2000/svg';

function pt(r, deg) {
  const t = deg * Math.PI / 180;
  return [+(r * Math.sin(t)).toFixed(3), +(-r * Math.cos(t)).toFixed(3)];
}

function sector(r1, r2, a1, a2) {
  const [x1, y1] = pt(r2, a1), [x2, y2] = pt(r2, a2);
  const [x3, y3] = pt(r1, a2), [x4, y4] = pt(r1, a1);
  return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;
}

function el(tag, attrs, parent) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}

function disc(r) {
  return `M0 ${-r}A${r} ${r} 0 1 1 0 ${r}A${r} ${r} 0 1 1 0 ${-r}Z`;
}

// Highlight is a single overlay path drawn on top of the board (CSS filters on
// SVG elements don't work in Safari, and neighbours would cover a stroke).
let hl;

function buildBoard(svg) {
  // Outer ring with numbers: just a background. Taps on it, or anywhere else in
  // the board area outside the double ring, count as a miss (see hitAt).
  el('path', { d: disc(R.numbers), fill: '#0b0b0b' }, svg);

  ORDER.forEach((n, i) => {
    const a1 = i * 18 - 9, a2 = i * 18 + 9;
    const even = i % 2 === 0;
    const single = even ? 'var(--board-dark)' : 'var(--board-light)';
    const ring = even ? 'var(--board-red)' : 'var(--board-green)';
    const parts = [
      [R.outerBull, R.tripleIn, single, 1],
      [R.tripleIn, R.tripleOut, ring, 3],
      [R.tripleOut, R.doubleIn, single, 1],
      [R.doubleIn, R.doubleOut, ring, 2],
    ];
    for (const [r1, r2, fill, m] of parts) {
      el('path', { d: sector(r1, r2, a1, a2), fill, class: 'wire', 'data-n': n, 'data-m': m }, svg);
    }
    const [tx, ty] = pt((R.doubleOut + R.numbers) / 2, i * 18);
    el('text', { x: tx, y: ty, class: 'num', 'data-num': n }, svg).textContent = n;
  });

  el('path', { d: disc(R.outerBull), fill: 'var(--board-green)', class: 'wire', 'data-n': 25, 'data-m': 1 }, svg);
  el('path', { d: disc(R.bull), fill: 'var(--board-red)', class: 'wire', 'data-n': 25, 'data-m': 2 }, svg);

  // Magnifier: a copy of the board that follows the finger. The heatmap reuses it too.
  boardArt = svg.innerHTML;
  const loupeSvg = $('loupe').querySelector('svg');
  loupeSvg.innerHTML = boardArt;
  markers = el('g', { class: 'markers' }, svg);
  hl = el('path', { class: 'hl', d: '' }, svg);
  loupeHl = el('path', { class: 'hl', d: '' }, loupeSvg);

  svg.addEventListener('pointerdown', e => {
    if (!S || S.winner !== null || S.pending || aim) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;   // right/middle click isn't a throw
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    aim = { id: e.pointerId, touch: e.pointerType !== 'mouse', loupe: false };
    // Only bring up the magnifier if the finger stays down a moment, so quick
    // taps don't flicker.
    if (aim.touch) aim.timer = setTimeout(() => { aim.loupe = true; updateAim(aim.last); }, 120);
    updateAim(e);
  });
  svg.addEventListener('pointermove', e => {
    if (aim) { if (e.pointerId === aim.id) updateAim(e); }
    else if (e.pointerType === 'mouse' && S && S.winner === null && !S.pending) setHl(hitAtEvent(e).d);
  });
  svg.addEventListener('pointerup', e => {
    if (!aim || e.pointerId !== aim.id) return;
    const h = updateAim(e);
    endAim();
    flash(h.d);
    if (navigator.vibrate) navigator.vibrate(15);
    throwDart(h.n, h.m, h);
  });
  svg.addEventListener('pointercancel', endAim);
  // Taps are handled on pointerup; stop the browser's follow-up click from
  // landing on whatever just appeared under the finger.
  svg.addEventListener('touchend', e => e.preventDefault());
  svg.addEventListener('pointerleave', () => { if (!aim) setHl(''); });
}

// What's under a board coordinate, plus the outline to highlight.
function hitAt(x, y) {
  const r = Math.hypot(x, y);
  if (r <= R.bull) return { n: 25, m: 2, d: disc(R.bull) };
  if (r <= R.outerBull) return { n: 25, m: 1, d: disc(R.outerBull) };
  if (r > R.doubleOut) return { n: 0, m: 0, d: '' };
  const i = Math.floor(((Math.atan2(x, -y) * 180 / Math.PI + 369) % 360) / 18);
  const [r1, r2, m] =
    r < R.tripleIn ? [R.outerBull, R.tripleIn, 1] :
    r <= R.tripleOut ? [R.tripleIn, R.tripleOut, 3] :
    r < R.doubleIn ? [R.tripleOut, R.doubleIn, 1] :
    [R.doubleIn, R.doubleOut, 2];
  return { n: ORDER[i], m, d: sector(r1, r2, i * 18 - 9, i * 18 + 9) };
}

function toBoard(e) {
  const svg = $('board');
  const p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}

function hitAtEvent(e) {
  const p = toBoard(e);
  return hitAt(p.x, p.y);
}

let boardArt = '';  // static board markup, for the loupe and the heatmap
let aim = null;   // the press currently aiming at the board
let markers;      // <g> holding this turn's hit markers
let loupeHl;

function setHl(d) {
  hl.setAttribute('d', d);
  loupeHl.setAttribute('d', d);
}

function updateAim(e) {
  aim.last = { clientX: e.clientX, clientY: e.clientY };
  const p = toBoard(e);
  const h = { ...hitAt(p.x, p.y), x: p.x, y: p.y };
  setHl(h.d);
  if (aim.loupe) {
    const size = 140, zoom = 2.2;
    const loupe = $('loupe');
    const w = size / ($('board').getScreenCTM().a * zoom);
    loupe.querySelector('svg').setAttribute('viewBox', `${p.x - w / 2} ${p.y - w / 2} ${w} ${w}`);
    loupe.querySelector('.loupe-label').textContent = dartLabel({ ...h, v: h.n * h.m });
    let top = e.clientY - size - 50;
    if (top < 8) top = e.clientY + 50;
    const left = Math.min(Math.max(e.clientX - size / 2, 8), window.innerWidth - size - 8);
    loupe.style.left = left + 'px';
    loupe.style.top = top + 'px';
    loupe.hidden = false;
  }
  return h;
}

function endAim() {
  if (!aim) return;
  clearTimeout(aim.timer);
  aim = null;
  $('loupe').hidden = true;
  setHl('');
}

let flashTimer;
function flash(d) {
  clearTimeout(flashTimer);
  hl.setAttribute('d', d);
  hl.classList.add('flash');
  flashTimer = setTimeout(() => {
    hl.classList.remove('flash');
    hl.setAttribute('d', '');
  }, 180);
}

// ---------- Dart helpers ----------
function dartLabel(d) {
  if (d.v === 0) return 'MISS';
  if (d.n === 25) return d.m === 2 ? 'BULL' : '25';
  return (d.m === 3 ? 'T' : d.m === 2 ? 'D' : '') + d.n;
}

// Checkout suggestions: shortest route, preferring trebles to set up and
// "popular" doubles to finish.
const ALL_DARTS = [];
for (let n = 20; n >= 1; n--) ALL_DARTS.push({ n, m: 3, v: n * 3 });
for (let n = 20; n >= 1; n--) ALL_DARTS.push({ n, m: 1, v: n });
ALL_DARTS.push({ n: 25, m: 1, v: 25 }, { n: 25, m: 2, v: 50 });
for (let n = 20; n >= 1; n--) ALL_DARTS.push({ n, m: 2, v: n * 2 });
const PREFERRED_DOUBLES = [20, 16, 18, 12, 10, 8, 19, 17, 15, 14, 13, 11, 9, 7, 6, 5, 4, 3, 2, 1];
const FINISH_DOUBLE = [...PREFERRED_DOUBLES.map(n => ({ n, m: 2, v: n * 2 })), { n: 25, m: 2, v: 50 }];
const FINISH_ANY = [...ALL_DARTS].sort((a, b) => b.v - a.v);
const checkoutCache = new Map();

function checkout(rem, dartsLeft, doubleOut) {
  if (rem <= 0 || dartsLeft <= 0 || rem > (doubleOut ? 170 : 180)) return null;
  const key = `${rem}|${dartsLeft}|${doubleOut}`;
  if (checkoutCache.has(key)) return checkoutCache.get(key);
  const finishers = doubleOut ? FINISH_DOUBLE : FINISH_ANY;
  let result = null;
  outer:
  for (let k = 1; k <= dartsLeft; k++) {
    if (k === 1) {
      const f = finishers.find(f => f.v === rem);
      if (f) { result = [f]; break; }
    } else if (k === 2) {
      for (const f of finishers) for (const a of ALL_DARTS)
        if (a.v + f.v === rem) { result = [a, f]; break outer; }
    } else {
      for (const f of finishers) for (const a of ALL_DARTS) {
        const b = ALL_DARTS.find(b => b.v === rem - f.v - a.v);
        if (b) { result = [a, b, f]; break outer; }
      }
    }
  }
  checkoutCache.set(key, result);
  return result;
}

// ---------- State ----------
const STORE_KEY = 'dart-counter-v1';
let S = null;          // current game state
let undoStack = [];    // snapshots of S taken before each dart
let setup = { names: ['Player 1', 'Player 2'], start: 501, doubleOut: true, firstTo: 3 };

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ S, undoStack, setup })); } catch {}
}
function load() {
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY));
    if (data) { S = data.S; undoStack = data.undoStack || []; setup = { ...setup, ...data.setup }; }
    // Games saved before match/history support.
    if (S) { S.firstTo ??= 1; S.log ??= []; S.done ??= []; }
  } catch {}
}

// Undo snapshots leave out finished legs (`done`), which keeps each one small
// however long the match runs. `done` only ever grows ("Next leg" appends), so
// a snapshot just records how many legs were finished and undo cuts back to that.
function snap() {
  undoStack.push(JSON.stringify({ ...S, done: undefined, doneLen: S.done.length }));
  if (undoStack.length > 300) undoStack.shift();
}

function newGame() {
  const names = setup.names.map(s => s.trim()).filter(Boolean);
  if (!names.length) names.push('Player 1');
  S = {
    start: setup.start,
    doubleOut: setup.doubleOut,
    players: names.map(name => ({ name, score: setup.start, darts: 0, legs: 0 })),
    legStarter: 0,
    leg: 1,
    cur: 0,
    turn: [],
    turnStart: setup.start,
    winner: null,
    pending: false,   // turn finished, waiting for "Next"
    matchStarter: 0,  // who threw first in leg 1
    firstTo: setup.firstTo,   // legs needed to win the match
    matchOver: false,
    log: [],          // finished turns of this leg
    done: [],         // earlier legs: { leg, winner, log }
  };
  undoStack = [];
}

// Same players and settings; the next player in line throws first.
function rematch() {
  const prev = S;
  setup = {
    ...setup,
    names: prev.players.map(p => p.name),
    start: prev.start,
    doubleOut: prev.doubleOut,
    firstTo: prev.firstTo,
  };
  newGame();
  S.matchStarter = S.legStarter = S.cur = ((prev.matchStarter || 0) + 1) % S.players.length;
  // The finished match stays one Undo away, history and heatmap included (a
  // full snapshot, `done` and all), in case Rematch was tapped by accident.
  undoStack = [JSON.stringify(prev)];
}

function nextLeg() {
  if (S.matchOver) return;
  snap();   // undoable: a wrongly entered checkout can still be fixed
  S.done.push({ leg: S.leg, winner: S.winner, log: S.log });
  S.log = [];
  S.leg++;
  S.legStarter = (S.legStarter + 1) % S.players.length;
  S.players.forEach(p => { p.score = S.start; p.darts = 0; p.last = null; });
  S.cur = S.legStarter;
  S.turn = [];
  S.turnStart = S.start;
  S.winner = null;
  S.pending = false;
}

// `at` is the tapped board position, if the dart came from the board.
function throwDart(n, m, at) {
  if (!S || S.winner !== null || S.pending) return;
  snap();

  const p = S.players[S.cur];
  const d = { n, m, v: n * m };
  if (at) { d.x = Math.round(at.x); d.y = Math.round(at.y); }
  fx = { dart: S.turn.length };
  S.turn.push(d);
  p.darts++;

  const rem = p.score - d.v;
  const bust = rem < 0 || (S.doubleOut && (rem === 1 || (rem === 0 && m !== 2)));

  if (bust) p.score = S.turnStart;
  else p.score = rem;
  if (bust) {
    fx.bust = true;
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
  }
  if (bust || rem === 0 || S.turn.length === 3) {
    finishTurn({
      labels: S.turn.map(dartLabel),
      total: S.turn.reduce((s, d) => s + d.v, 0),
      bust,
    }, true);
  }
  save();
  render();
}

// Enter a whole turn as one number. Replaces any darts already tapped this turn.
function enterTotal(total) {
  if (!S || S.winner !== null) return;
  snap();
  const p = S.players[S.cur];
  p.darts += 3 - S.turn.length;
  p.score = S.turnStart;
  S.turn = [];
  const rem = p.score - total;
  const bust = rem < 0 || (S.doubleOut && rem === 1);
  if (!bust) p.score = rem;
  finishTurn({ labels: [], total, bust, typed: true }, false);
  save();
  render();
}

// Remember the turn for the "last turn" info, then win the leg or pass on.
// With `wait`, the finished turn stays on screen until "Next" is pressed, so
// whoever entered it can check it (or undo) before play moves on.
function finishTurn(last, wait) {
  const p = S.players[S.cur];
  p.last = last;
  const out = !last.bust && p.score === 0;
  S.log.push({
    p: S.cur,
    darts: last.typed ? [] : S.turn.slice(),
    total: last.total,
    bust: last.bust,
    typed: !!last.typed,
    left: p.score,
    out,
  });
  if (out) {
    S.turn = [];
    S.winner = S.cur;
    p.legs++;
    if (p.legs >= S.firstTo) S.matchOver = true;
    return;
  }
  if (wait) S.pending = true;
  else nextPlayer();
}

function nextPlayer() {
  S.pending = false;
  S.turn = [];
  S.cur = (S.cur + 1) % S.players.length;
  S.turnStart = S.players[S.cur].score;
}

// The Next button can pop up right under the finger that finished the turn (it
// sits in the empty area below the board, where misses are tapped). Ignore taps
// that arrive just after it appears so that same touch can't press it.
let nextShownAt = 0;
function confirmTurn() {
  if (!S || !S.pending || performance.now() - nextShownAt < 400) return;
  snap();
  nextPlayer();
  save();
  render();
}

function lastText(last) {
  if (!last) return '';
  const darts = last.typed ? `${last.total} (typed)` : `${last.labels.join(' ')} = ${last.total}`;
  return last.bust ? `BUST · ${darts}` : darts;
}

function undo() {
  if (!undoStack.length) return;
  const s = JSON.parse(undoStack.pop());
  // Ordinary snapshots leave out finished legs: rebuild them from the current
  // list (older saves have no doneLen and never changed it). A Rematch snapshot
  // carries its own.
  if (!s.done) s.done = s.doneLen == null ? S.done : S.done.slice(0, s.doneLen);
  delete s.doneLen;
  S = s;
  save();
  render();
}

// Manually set a player's name / remaining score (undoable).
let editing = null;
function openEdit(i) {
  if (!S) return;
  editing = i;
  const p = S.players[i];
  $('editName').value = p.name;
  $('editScore').value = p.score;
  $('editScore').classList.remove('bad');
  $('editOverlay').hidden = false;
  fitOverlays();
  $('editScore').focus();
  $('editScore').select();
}
function closeEdit() { editing = null; $('editOverlay').hidden = true; }
function saveEdit(score) {
  const p = S.players[editing];
  const min = S.doubleOut ? 2 : 1;
  if (!Number.isInteger(score) || score < min || score > 9999) {
    $('editScore').classList.add('bad');
    return;
  }
  snap();
  p.name = $('editName').value.trim() || p.name;
  if (S.winner === editing) {
    // Editing the leg winner's score reopens the leg: the "checkout" becomes an
    // ordinary turn ending on the corrected score, and play passes on as usual
    // (so the bust baseline and History's rounds stay right).
    S.winner = null;
    S.matchOver = false;
    p.legs--;
    p.score = score;
    const lastTurn = S.log[S.log.length - 1];
    if (lastTurn && lastTurn.out) { lastTurn.out = false; lastTurn.left = score; }
    nextPlayer();
  } else {
    // Keep the bust baseline in sync if we edit the player mid-turn.
    if (editing === S.cur) S.turnStart += score - p.score;
    p.score = score;
  }
  closeEdit();
  save();
  render();
}

// Numpad for typing a turn total.
const IMPOSSIBLE = new Set([163, 166, 169, 172, 173, 175, 176, 178, 179]);
function openPad() {
  if (!S || S.winner !== null || S.pending) return;
  const p = S.players[S.cur];
  $('padTitle').textContent = p.name;
  $('padInput').value = '';
  updatePad();
  $('padOverlay').hidden = false;
  fitOverlays();
  $('padInput').focus();   // synchronous with the tap so mobile opens the keyboard
}
function closePad() { $('padOverlay').hidden = true; }

// Keep dialogs glued to the visible part of the screen: when the keyboard
// opens, the visual viewport shrinks (and may scroll), so follow it.
function fitOverlays() {
  const vv = window.visualViewport;
  if (!vv) return;
  for (const o of [$('padOverlay'), $('editOverlay')]) {
    if (o.hidden) continue;
    o.style.top = vv.offsetTop + 'px';
    o.style.height = vv.height + 'px';
  }
}
function padCheck() {
  const v = +$('padInput').value || 0;
  const rem = S.turnStart - v;
  if (v > 180 || IMPOSSIBLE.has(v)) return { ok: false, msg: `${v} isn't possible with 3 darts`, cls: 'bad' };
  if (rem === 0 && S.doubleOut && !checkout(v, 3, true)) {
    return { ok: false, msg: `${v} can't be checked out`, cls: 'bad' };
  }
  // A typed total replaces darts already tapped this turn: say so, not silently.
  if (S.turn.length) {
    return { ok: true, msg: `Replaces ${S.turn.map(dartLabel).join(' ')} entered this turn`, cls: '' };
  }
  return { ok: true, msg: '', cls: '' };
}
function updatePad() {
  const input = $('padInput');
  input.value = input.value.replace(/\D/g, '').slice(0, 3);
  const c = padCheck();
  $('padHint').textContent = c.msg;
  $('padHint').className = `pad-hint ${c.cls}`;
  $('padOk').disabled = !c.ok;
}
function submitPad(e) {
  e.preventDefault();
  if (!padCheck().ok) return;
  const v = +$('padInput').value || 0;
  $('padInput').blur();
  closePad();
  enterTotal(v);
}

// Points actually scored per 3 darts (busted darts count as thrown).
function average(p) {
  return p.darts ? ((S.start - p.score) / p.darts * 3).toFixed(1) : '–';
}

// ---------- Rendering ----------
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// One-shot animation hints from the last action; consumed by the next render so
// re-renders (undo, edits, reloads) never replay them.
let fx = null;
// The leg/match result dialog was tapped away (until the leg changes).
let winDismissed = false;

function render() {
  const f = fx;
  fx = null;
  const inGame = !!S;
  keepAwake();
  $('setup').hidden = inGame;
  $('game').hidden = !inGame;
  if (!inGame) {
    // Leaving the game: make sure no game dialog stays on top of the setup screen.
    for (const id of ['winOverlay', 'padOverlay', 'editOverlay', 'statsOverlay', 'confirmOverlay']) $(id).hidden = true;
    return renderSetup();
  }


  const cur = S.players[S.cur];
  const co = S.winner === null ? checkout(cur.score, 3 - S.turn.length, S.doubleOut) : null;

  renderPlayers();
  centerActivePlayer();

  markers.innerHTML = S.turn.map((d, i) => d.x == null ? '' : `
    <g transform="translate(${d.x} ${d.y})"><g class="${f && f.dart === i ? 'mk-new' : ''}">
      <circle r="8"></circle><text>${i + 1}</text>
    </g></g>`).join('');


  const slots = [0, 1, 2].map(i => {
    const d = S.turn[i];
    if (!d) return `<div class="slot empty">•</div>`;
    const cls = (d.m === 3 ? 't' : d.m === 2 ? 'd' : '') + (f && f.dart === i ? ' pop' : '');
    return `<div class="slot ${cls}">${dartLabel(d)}</div>`;
  });
  const total = S.turn.reduce((s, d) => s + d.v, 0);
  const busted = S.pending && cur.last && cur.last.bust;
  $('turn').innerHTML = slots.join('') +
    (busted ? `<div class="slot total bust ${f && f.bust ? 'shake' : ''}">BUST</div>` : `<div class="slot total">${total}</div>`);

  // The checkout route takes the top bar's centre while there is one (legs are on the cards).
  $('matchInfo').textContent = co ? co.map(dartLabel).join(' · ')
    : S.firstTo > 1 ? `Leg ${S.leg} · first to ${S.firstTo}` : `Leg ${S.leg}`;
  $('matchInfo').classList.toggle('co', !!co);
  // Light up the board numbers the checkout route uses.
  const coNums = new Set((co || []).map(d => d.n));
  for (const t of $('board').querySelectorAll('.num')) t.classList.toggle('co', coNums.has(+t.dataset.num));

  $('boardWrap').classList.toggle('locked', !!S.pending || S.winner !== null);
  // Drop any leftover hover on a locked board (but let the last dart's flash play).
  if ((S.pending || S.winner !== null) && !hl.classList.contains('flash')) setHl('');
  $('game').classList.toggle('pending', !!S.pending || S.winner !== null);
  // The same floating button either passes the turn on or, after the result
  // dialog was tapped away, brings it back.
  const showResult = S.winner !== null && winDismissed;
  if ($('nextBtn').hidden && S.pending) nextShownAt = performance.now();
  $('nextBtn').hidden = !S.pending && !showResult;
  $('nextBtn').textContent = showResult
    ? (S.matchOver ? 'Match result →' : 'Leg result →')
    : `Next: ${S.players[(S.cur + 1) % S.players.length].name} →`;

  $('undoBtn').disabled = !undoStack.length;
  $('typeBtn').disabled = S.winner !== null || !!S.pending;

  if (S.winner !== null) {
    const w = S.players[S.winner];
    const over = !!S.matchOver;
    $('winLabel').textContent = over && S.firstTo > 1 ? `Match won · leg ${S.leg}` : `Leg ${S.leg} won`;
    $('winName').textContent = w.name;
    $('winStats').innerHTML = `${w.darts} darts · avg ${average(w)}` + (S.firstTo > 1
      ? `<div class="standings">${S.players.map(p => `${esc(p.name)} <b>${p.legs}</b>`).join(' · ')}</div>`
      : '');
    $('nextLegBtn').hidden = over;
    $('rematchBtn').hidden = !over;
    // Mid-match there's no "New game" here: one stray tap would throw the match
    // away. Leaving early goes through the ✕ (with a confirm).
    $('newGameBtn').hidden = !over;
    $('winActions').classList.toggle('three', over);
    // Only one dialog at a time: the result steps aside while History is open.
    $('winOverlay').hidden = winDismissed || !$('statsOverlay').hidden || !$('confirmOverlay').hidden;
  } else {
    winDismissed = false;
    $('winOverlay').hidden = true;
  }
}

// Player cards are updated in place (not rebuilt) so the active-player change
// can transition smoothly.
function renderPlayers() {
  const box = $('players');
  if (box.children.length !== S.players.length) {
    box.innerHTML = S.players.map((_, i) => `
      <div class="player" data-i="${i}">
        <div class="name"><span></span><span class="legs"></span></div>
        <div class="score"></div>
        <div class="avg"></div>
        <div class="last"></div>
      </div>`).join('');
  }
  S.players.forEach((p, i) => {
    const card = box.children[i];
    card.classList.toggle('active', i === S.cur);
    card.querySelector('.name span').textContent = p.name;
    card.querySelector('.legs').textContent = S.firstTo > 1 ? `${p.legs}/${S.firstTo}` : (p.legs || '');
    card.querySelector('.score').textContent = p.score;
    card.querySelector('.avg').textContent = `avg ${average(p)}`;
    const last = card.querySelector('.last');
    last.textContent = p.last ? lastText(p.last) : '\u00a0';
    last.classList.toggle('bust', !!(p.last && p.last.bust));
  });
}

// Bring the player who's throwing into view in the carousel.
function centerActivePlayer() {
  const box = $('players'), card = box.children[S.cur];
  if (!card || box.scrollWidth <= box.clientWidth) return;
  const left = card.offsetLeft - box.offsetLeft - (box.clientWidth - card.offsetWidth) / 2;
  box.scrollLeft = left;
}

function renderSetup() {
  const box = $('playerInputs');
  box.innerHTML = '';
  setup.names.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `<input value="${esc(name)}" placeholder="Player ${i + 1}" maxlength="20">
      <button class="icon-btn" aria-label="Remove">×</button>`;
    row.querySelector('input').addEventListener('input', e => { setup.names[i] = e.target.value; save(); });
    row.querySelector('button').addEventListener('click', () => {
      if (setup.names.length > 1) { setup.names.splice(i, 1); save(); renderSetup(); }
    });
    box.appendChild(row);
  });
  segOn($('startSeg'), b => +b.dataset.v === setup.start);
  $('doubleOut').checked = setup.doubleOut;
  segOn($('legsSeg'), b => +b.dataset.v === setup.firstTo);
}

// Mark the chosen button of a segmented control, visibly and for screen readers.
function segOn(box, isOn) {
  for (const b of box.querySelectorAll('button')) {
    const on = !!isOn(b);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  }
}

// ---------- History & heatmap ----------
// view.leg is 'all' (heatmap only) or a leg number as a string.
let view = { tab: 'history', leg: 'all', player: 'all' };

function allLegs() {
  return [...S.done, { leg: S.leg, winner: S.winner, log: S.log }];
}

function openStats(tab) {
  view = { tab, leg: tab === 'heat' ? 'all' : String(S.leg), player: 'all' };
  $('statsOverlay').hidden = false;
  renderStats();
  render();   // hides the result dialog underneath
}
// In-app replacement for confirm(). Like History, it takes the result dialog's
// place while open, so dialogs never stack.
let confirmAction = null;
function askConfirm(title, text, yesLabel, action) {
  $('confirmTitle').textContent = title;
  $('confirmText').textContent = text;
  $('confirmYes').textContent = yesLabel;
  confirmAction = action;
  $('confirmOverlay').hidden = false;
  if (S) render();
}
function closeConfirm() {
  confirmAction = null;
  $('confirmOverlay').hidden = true;
  if (S) render();
}

// ---------- Keep the screen awake during a game ----------
// Phones dim and lock mid-match otherwise. The browser drops the lock whenever
// the page is hidden, so it's re-requested on every render and when the page
// becomes visible again. Needs HTTPS; silently does nothing where unsupported.
let wakeLock = null, wakeReq = null;
function keepAwake() {
  if (!('wakeLock' in navigator)) return;
  const want = !!S && document.visibilityState === 'visible';
  if (want && !wakeLock && !wakeReq) {
    wakeReq = navigator.wakeLock.request('screen')
      .then(lock => {
        wakeLock = lock;
        lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
        if (!S) keepAwake();   // the game ended while we were waiting: let go again
      })
      .catch(() => {})
      .finally(() => { wakeReq = null; });
  } else if (!want && wakeLock) {
    const lock = wakeLock;
    wakeLock = null;
    lock.release().catch(() => {});
  }
}
document.addEventListener('visibilitychange', keepAwake);

// Back to whatever was showing before, e.g. the leg/match result.
function closeStats() { $('statsOverlay').hidden = true; if (S) render(); }

function tabs(box, items, current, attr) {
  box.innerHTML = items.map(([v, label]) =>
    `<button data-${attr}="${v}" class="${v === current ? 'on' : ''}" aria-pressed="${v === current}">${esc(label)}</button>`).join('');
}

function renderStats() {
  const legs = allLegs();
  const heat = view.tab === 'heat';
  segOn($('statsTabs'), b => b.dataset.t === view.tab);

  const legItems = [...(heat ? [['all', 'All legs']] : []), ...legs.map(l => [String(l.leg), `Leg ${l.leg}`])];
  if (!legItems.some(([v]) => v === view.leg)) view.leg = heat ? 'all' : String(S.leg);
  tabs($('legTabs'), legItems, view.leg, 'leg');
  $('legTabs').hidden = legs.length < 2;

  tabs($('playerTabs'), [['all', 'All'], ...S.players.map((p, i) => [String(i), p.name])], view.player, 'player');
  $('playerTabs').hidden = !heat || S.players.length < 2;

  const picked = view.leg === 'all' ? legs : legs.filter(l => String(l.leg) === view.leg);
  $('statsBody').innerHTML = heat ? heatHTML(picked) : historyHTML(picked[0]);
  $('statsBody').scrollTop = 0;   // new tab/leg/player: start from the top
}

function historyHTML(L) {
  // The turn being thrown right now (current leg only), shown after the finished ones.
  const live = L && L.leg === S.leg && S.winner === null && !S.pending && S.turn.length ? S.turn : null;
  if (!L || (!L.log.length && !live)) return `<div class="stats-empty">No turns yet in this leg</div>`;
  const n = S.players.length;
  const rows = S.players.map((p, i) => {
    const turns = L.log.filter(t => t.p === i);
    const darts = turns.reduce((s, t) => s + (t.typed ? 3 : t.darts.length), 0);
    const ok = turns.filter(t => !t.bust);
    const scored = ok.reduce((s, t) => s + t.total, 0);
    const best = ok.length ? Math.max(...ok.map(t => t.total)) : '–';
    const avg = darts ? (scored / darts * 3).toFixed(1) : '–';
    return `<tr${L.winner === i ? ' class="won"' : ''}><td>${esc(p.name)}</td><td>${darts}</td><td>${avg}</td><td>${best}</td></tr>`;
  });
  let html = `<table class="sum"><tr><th>Player</th><th>Darts</th><th>Avg</th><th>Best</th></tr>${rows.join('')}</table><div>`;
  L.log.forEach((t, i) => {
    if (i % n === 0) html += `<div class="h-round">Round ${i / n + 1}</div>`;
    const darts = t.typed ? 'typed' : t.darts.map(dartLabel).join(' ');
    html += `<div class="h-row${t.bust ? ' bust' : ''}${t.out ? ' out' : ''}">
      <span class="h-name">${esc(S.players[t.p].name)}</span><span class="h-darts">${darts}</span>
      <span class="h-total">${t.bust ? 'BUST' : t.total}</span><span class="h-left">${t.out ? '✓' : t.left}</span></div>`;
  });
  if (live) {
    const i = L.log.length;
    if (i % n === 0) html += `<div class="h-round">Round ${i / n + 1}</div>`;
    html += `<div class="h-row live">
      <span class="h-name">${esc(S.players[S.cur].name)}</span><span class="h-darts">${live.map(dartLabel).join(' ')} …</span>
      <span class="h-total">${live.reduce((s, d) => s + d.v, 0)}</span><span class="h-left">${S.players[S.cur].score}</span></div>`;
  }
  return html + '</div>';
}

function heatHTML(legs) {
  const turns = legs.flatMap(l => l.log).filter(t => view.player === 'all' || String(t.p) === view.player);
  const darts = turns.flatMap(t => t.darts);
  const pts = darts.filter(d => d.x != null);

  const blobs = pts.map(d => `<circle cx="${d.x}" cy="${d.y}" r="20" fill="url(#heatDot)"></circle>`).join('');
  const pins = pts.map(d => `<circle class="pin" cx="${d.x}" cy="${d.y}" r="2.5"></circle>`).join('');
  const svg = `<svg class="board-art heat-board" viewBox="-213 -213 426 426">
    <defs><radialGradient id="heatDot">
      <stop offset="0" stop-color="#ff3b1f" stop-opacity=".6"></stop>
      <stop offset=".5" stop-color="#ffb000" stop-opacity=".25"></stop>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"></stop>
    </radialGradient></defs>${boardArt}<g class="heat">${blobs}${pins}</g></svg>`;

  // Most-hit beds (misses included), counting every dart with a known segment.
  const counts = new Map();
  for (const d of darts) counts.set(dartLabel(d), (counts.get(dartLabel(d)) || 0) + 1);
  const top = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 8);
  const hits = top.map(([l, c]) => `
    <div class="hit${l === 'MISS' ? ' miss' : ''}">
      <span class="hit-l">${l === 'MISS' ? 'Miss' : l}</span>
      <span class="hit-n">×${c} · ${Math.round(c / darts.length * 100)}%</span>
    </div>`).join('');

  return svg +
    (top.length ? `<div class="label">Most hit</div><div class="hits">${hits}</div>` : '') +
    (pts.length ? '' : `<div class="note">No tapped darts yet: darts show up here once they are tapped on the board.</div>`);
}

// ---------- Wiring ----------
buildBoard($('board'));

$('addPlayer').onclick = () => {
  if (setup.names.length >= 8) return;
  setup.names.push(`Player ${setup.names.length + 1}`);
  save(); renderSetup();
};
$('startSeg').onclick = e => {
  const b = e.target.closest('button');
  if (b) { setup.start = +b.dataset.v; save(); renderSetup(); }
};
$('doubleOut').onchange = e => { setup.doubleOut = e.target.checked; save(); };
$('legsSeg').onclick = e => {
  const b = e.target.closest('button');
  if (b) { setup.firstTo = +b.dataset.v; save(); renderSetup(); }
};
$('histBtn').onclick = () => openStats('history');
$('winHistBtn').onclick = () => openStats('history');
$('rematchBtn').onclick = () => { rematch(); save(); render(); };
$('winOverlay').onclick = e => { if (e.target === e.currentTarget) { winDismissed = true; render(); } };
$('statsClose').onclick = closeStats;
$('statsX').onclick = closeStats;
$('statsOverlay').onclick = e => { if (e.target === e.currentTarget) closeStats(); };
$('statsTabs').onclick = e => {
  const b = e.target.closest('button');
  if (b) { view.tab = b.dataset.t; renderStats(); }
};
$('legTabs').onclick = e => {
  const b = e.target.closest('button');
  if (b) { view.leg = b.dataset.leg; renderStats(); }
};
$('playerTabs').onclick = e => {
  const b = e.target.closest('button');
  if (b) { view.player = b.dataset.player; renderStats(); }
};
$('startBtn').onclick = () => { newGame(); save(); render(); };
$('players').onclick = e => {
  const card = e.target.closest('[data-i]');
  if (card) openEdit(+card.dataset.i);
};
$('editForm').onsubmit = e => { e.preventDefault(); saveEdit(Number($('editScore').value)); };
$('editOverlay').onclick = e => { if (e.target === e.currentTarget) closeEdit(); };
$('missBtn').onclick = () => {
  if (navigator.vibrate) navigator.vibrate(15);   // same tap feedback as the board
  throwDart(0, 0);
};
$('nextBtn').onclick = () => {
  if (S && S.winner !== null) { winDismissed = false; render(); }
  else confirmTurn();
};
// The strip under the board (outside the SVG) is still part of the board area: a miss.
$('boardWrap').addEventListener('click', e => {
  if (e.target !== e.currentTarget) return;
  if (navigator.vibrate) navigator.vibrate(15);
  throwDart(0, 0);
});
$('typeBtn').onclick = openPad;
$('padInput').oninput = updatePad;
$('padForm').onsubmit = submitPad;
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitOverlays);
  visualViewport.addEventListener('scroll', fitOverlays);
}
// Tapping the dimmed area around the drawer closes it.
$('padOverlay').onclick = e => { if (e.target === e.currentTarget) { $('padInput').blur(); closePad(); } };
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('confirmOverlay').hidden) return closeConfirm();
  if (!$('padOverlay').hidden) { $('padInput').blur(); closePad(); }
  if (!$('editOverlay').hidden) closeEdit();
  if (!$('statsOverlay').hidden) closeStats();
  else if (!$('winOverlay').hidden) { winDismissed = true; render(); }
});
$('undoBtn').onclick = undo;
$('winUndoBtn').onclick = undo;
$('nextLegBtn').onclick = () => { nextLeg(); save(); render(); };
const endGame = () => { S = null; undoStack = []; save(); render(); };
$('newGameBtn').onclick = () => askConfirm(
  'Start a new game?', 'This match\'s history and heatmap will be cleared.', 'New game', endGame);
$('confirmNo').onclick = closeConfirm;
$('confirmYes').onclick = () => { const a = confirmAction; closeConfirm(); if (a) a(); };
$('confirmOverlay').onclick = e => { if (e.target === e.currentTarget) closeConfirm(); };
$('quitBtn').onclick = () => askConfirm(
  'Leave this game?', 'The current match, its history and heatmap will be lost.', 'Leave', endGame);

load();
render();

// Works offline once visited (only over http(s); not when opened as a local file).
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
